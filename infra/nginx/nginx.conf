user nginx;
worker_processes auto;
error_log /dev/stderr warn;

events { worker_connections 4096; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  server_tokens off;

  # Docker's embedded DNS. valid=5s => a stopped container drops out of an upstream within ~5s.
  resolver 127.0.0.11 valid=5s ipv6=off;

  # Correlation ID: keep a well-formed X-Request-ID from the caller, otherwise generate one.
  map $http_x_request_id $trace_id {
    "~^[A-Za-z0-9-]{8,64}$" $http_x_request_id;
    default                 $request_id;
  }

  log_format main '$remote_addr "$request" $status rid=$trace_id upstream=$upstream_addr '
                  'upstream_status=$upstream_status served_by=$upstream_http_x_served_by rt=$request_time';

  include /etc/nginx/conf.d/*.conf;
}
