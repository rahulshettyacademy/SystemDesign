# LAB MODE (local teaching): edge + internal LB + teaching dashboard, JSON access logs for tracing.
log_format lab_json escape=json '{"ts":"$msec","trace_id":"$trace_id","span_id":"$request_id","parent_span_id":"$http_x_parent_span_id",'
  '"server":"$lab_server","method":"$request_method","uri":"$request_uri","status":"$status","request_time":"$request_time",'
  '"upstream_addr":"$upstream_addr","upstream_status":"$upstream_status","upstream_time":"$upstream_response_time",'
  '"served_by":"$upstream_http_x_served_by"}';

include /etc/nginx/upstreams.inc;
upstream lab_service { zone lab 64k; server lab:3000 resolve; }

server {
  listen 8080;
  set $lab_server edge;
  access_log /dev/stdout main;
  access_log /var/log/nginx/lab/access.json lab_json;
  include /etc/nginx/edge.inc;
}

# INTERNAL LOAD BALANCER (not published to the host): service-to-service calls to product instances.
server {
  listen 8090;
  set $lab_server internal-lb;
  access_log /var/log/nginx/lab/access.json lab_json;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header X-Parent-Span-Id $request_id;
  proxy_connect_timeout 1s;
  proxy_next_upstream error timeout http_502 http_503 http_504;
  location /internal/products { proxy_pass http://product_service; }
  location / { return 404; }
}

# TEACHING DASHBOARD (published on 127.0.0.1:8081 only).
server {
  listen 8081;
  access_log off;
  location /lab/api/ {
    proxy_pass http://lab_service;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;            # Server-Sent Events
    proxy_read_timeout 1h;
  }
  location / {
    root /usr/share/nginx/lab;
    try_files $uri /index.html;
  }
}
