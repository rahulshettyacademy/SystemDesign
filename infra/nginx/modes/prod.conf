# PRODUCTION-LIKE MODE: no teaching dashboard, no lab logs, no diagnostics.
include /etc/nginx/upstreams.inc;

server {
  listen 8080;
  access_log /dev/stdout main;
  include /etc/nginx/edge.inc;
}

server {
  listen 8090;
  access_log off;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_connect_timeout 1s;
  proxy_next_upstream error timeout http_502 http_503 http_504;
  location /internal/products { proxy_pass http://product_service; }
  location / { return 404; }
}
